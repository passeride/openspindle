# Temporary self-formatting workflow for the Patterns feature branch.
name: Patterns branch formatting
on:
  push:
    branches: [feat/parametric-patterns]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'passeride/openspindle'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npx prettier --write README.md docs/patterns.md standalone.html package.json
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src electron host packages tools README.md docs/patterns.md standalone.html package.json
          if ! git diff --cached --quiet; then
            git commit -m "style(patterns): format parametric editor"
            git push origin HEAD:feat/parametric-patterns
          fi
